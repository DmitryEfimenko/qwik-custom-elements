output:
  - execution_info
  - failure

pre-commit:
  parallel: true
  jobs:
    - name: lint
      run: pnpm lint

    - name: format:check
      run: pnpm format:check

pre-push:
  jobs:
    - name: typecheck
      run: pnpm typecheck

    - name: test
      run: pnpm test

    - name: e2e
      run: pnpm e2e
