output:
  - execution_info
  - failure

pre-commit:
  skip:
    - run: '[ -n "$CI" ]'
      reason: 'Skipping pre-commit hooks in CI environment'
  parallel: true
  jobs:
    - name: lint
      run: pnpm lint

    - name: format:check
      run: pnpm format:check

pre-push:
  skip:
    - run: '[ -n "$CI" ]'
      reason: 'Skipping pre-push hooks in CI environment'
  jobs:
    - name: typecheck
      run: pnpm typecheck

    - name: test
      run: pnpm test

    - name: e2e
      run: pnpm e2e
