name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          PLAYWRIGHT_CHANNEL: chrome

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

  drift-check:
    name: Generated Output Drift Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages (no Turbo cache)
        run: pnpm exec turbo run build --no-cache

      - name: Run generator
        run: pnpm generate

      - name: Check for generated output drift
        run: |
          if ! git diff --exit-code -- apps/qwik-demo/src/generated/; then
            echo "::error::Generated output has drifted from committed state. Run 'pnpm generate' locally and commit the result."
            exit 1
          fi

  compatibility-matrix-check:
    name: Compatibility Matrix Policy Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check compatibility matrix
        run: pnpm compatibility:check
